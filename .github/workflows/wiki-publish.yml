# Canonical wiki publish — default branch only. Never run this on PR HEAD.
name: wiki-publish

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitNexus
        run: npm i -g gitnexus

      - name: Index repository
        env:
          GITNEXUS_LBUG_BUFFER_POOL_SIZE: '2147483648'
        run: gitnexus analyze --index-only

      - name: Generate wiki
        env:
          GITNEXUS_WIKI_API_KEY: ${{ secrets.GITNEXUS_WIKI_API_KEY }}
          GITNEXUS_WIKI_PROVIDER: ${{ vars.GITNEXUS_WIKI_PROVIDER }}
        run: |
          if [ -z "$GITNEXUS_WIKI_API_KEY" ]; then
            echo "Wiki generate skipped: set GITNEXUS_WIKI_API_KEY."
            exit 0
          fi
          npm ci
          npx tsx src/bin/cli.ts wiki generate

      - name: Publish to provider wiki
        env:
          ORCH_GITHUB_WIKI_TOKEN: ${{ secrets.ORCH_GITHUB_WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! find .gitnexus/wiki -name '*.md' | grep -q .; then
            echo "No generated wiki pages — skip canonical publish."
            exit 0
          fi
          echo "Trusted default-branch context: ${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}"
          npx tsx src/bin/cli.ts wiki publish
          echo "Do not use --force. PR previews belong in wiki-preview.yml."
          echo "BOOTSTRAP_REQUIRED exits 1 — create the first GitHub wiki page, then rerun."
