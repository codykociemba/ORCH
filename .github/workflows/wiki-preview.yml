# PR wiki preview only. Never publish canonical wiki from PR HEAD.
name: wiki-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitNexus
        run: npm i -g gitnexus

      - name: Index repository
        env:
          GITNEXUS_LBUG_BUFFER_POOL_SIZE: '2147483648'
        run: |
          gitnexus analyze --index-only
          gitnexus status --json > /tmp/gitnexus-status.json
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("/tmp/gitnexus-status.json","utf8")); fs.writeFileSync("/tmp/gitnexus-fresh.txt", String(s.status||"unknown"));'

      - name: Generate wiki preview
        env:
          GITNEXUS_WIKI_API_KEY: ${{ secrets.GITNEXUS_WIKI_API_KEY }}
          GITNEXUS_WIKI_PROVIDER: ${{ vars.GITNEXUS_WIKI_PROVIDER }}
        run: |
          echo "Do not gitnexus-publish or push a wiki from a pull request."
          if [ -z "$GITNEXUS_WIKI_API_KEY" ]; then
            echo "Wiki generate skipped: set repository secret GITNEXUS_WIKI_API_KEY."
            echo "Local CLIs are not available on this runner."
            exit 0
          fi
          if [ -f src/bin/cli.ts ]; then
            npm ci
            npx tsx src/bin/cli.ts wiki generate
          else
            npm install -g git+https://github.com/codykociemba/ORCH.git
            orch wiki generate
          fi

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitnexus-wiki-preview
          path: .gitnexus/wiki
          if-no-files-found: ignore

      - name: Comment wiki preview status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PAGES=0
          if [ -d .gitnexus/wiki ]; then
            PAGES=$(find .gitnexus/wiki -name '*.md' | wc -l | tr -d ' ')
          fi
          INDEX_STATUS=$(cat /tmp/gitnexus-fresh.txt 2>/dev/null || echo unknown)
          if [ -z "${{ secrets.GITNEXUS_WIKI_API_KEY }}" ]; then
            STATUS="SKIPPED"
          elif [ "$INDEX_STATUS" != "current" ]; then
            STATUS="FAIL"
          elif [ "$PAGES" -gt 0 ]; then
            STATUS="PASS"
          else
            STATUS="FAIL"
          fi
          BODY=$(cat <<EOF
          <!-- orch-wiki-preview -->
          Wiki Preview
          ────────────────────────────
          GitNexus index: ${INDEX_STATUS}
          Source SHA: ${HEAD_SHA:0:7}
          Pages generated/updated: $PAGES
          Status: $STATUS
          Artifact: gitnexus-wiki-preview
          EOF
          )
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("orch-wiki-preview")) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --body "$BODY"
          fi
          if [ "$STATUS" = "FAIL" ]; then
            echo "Wiki preview required check failed (trusted PR generated 0 pages)."
            exit 1
          fi
